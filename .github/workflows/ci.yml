name: CI

on:
  push:
    branches: [main, v2, develop]
  pull_request:
    branches: [main, v2, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint DB references (no legacy database.js)
        run: |
          echo "=== Vérification : aucun import de database.js ==="
          if grep -rn "require\(['\"][^'\"]*database\.js['\"]\)" src/ tests/ 2>/dev/null | grep -v "legacy-bridge"; then
            echo "❌ Des imports de database.js subsistent !"
            exit 1
          fi
          echo "✅ Aucun import legacy de database.js"

      - name: Verify Drizzle migrations consistency
        run: |
          echo "=== Vérification : schema Drizzle vs migrations ==="
          TMP_DIR=$(mktemp -d)
          cp -r src/db/migrations "$TMP_DIR/orig"
          npx drizzle-kit generate --name=ci_check 2>&1 | tee /tmp/drizzle-out.log || true
          if grep -i "generated.*migration" /tmp/drizzle-out.log; then
            echo "❌ Le schema Drizzle a changé sans regénération de migration !"
            echo "→ Exécute 'npm run db:generate' en local et commit le fichier généré."
            diff -r "$TMP_DIR/orig" src/db/migrations || true
            exit 1
          fi
          echo "✅ Migrations à jour (db:generate n'a rien produit)"

      - name: Run tests
        run: npm test

      - name: Coverage
        run: npm run coverage
