services:
  # Service du Bot Discord & API Webhook (avec SQLite)
  bot:
    build:
      context: .
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-dev}
        GITHUB_REPO: ${GITHUB_REPO:-sinteam-bot/chienne-bot}
    container_name: discord_bot
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Persistance de la base de donnees SQLite
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      # Configuration Discord
      DISCORD_TOKEN: ${DISCORD_TOKEN:-${BOT_TOKEN}}
      BOT_TOKEN: ${BOT_TOKEN:-${DISCORD_TOKEN}}
      BOT_COLOR: ${BOT_COLOR:-f2c7ce}
      CLIENT_ID: ${CLIENT_ID}
      GUILD_ID: ${GUILD_ID:-1337543177086959657}
      LOG_CHANNEL_ID: ${LOG_CHANNEL_ID:-1540433649994829824}
      DAILY_MESSAGE_CHANNEL_ID: ${DAILY_MESSAGE_CHANNEL_ID:-1337807772024180756}

      # Configuration GitHub & Versioning
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
      GITHUB_REPO: ${GITHUB_REPO:-sinteam-bot/chienne-bot}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

      # Configuration Serveur Express & Base de Donnees SQLite
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      DB_PATH: "/app/data/bot.db"

      # Configuration OpenRouter
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-20b:free}
      OPENROUTER_MAX_TOKENS: ${OPENROUTER_MAX_TOKENS:-500}
      OPENROUTER_TEMPERATURE: ${OPENROUTER_TEMPERATURE:-0.7}
