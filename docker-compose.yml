services:
  # Service du Bot Discord & API Webhook
  bot:
    build: .
    container_name: discord_bot
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy

  # Base de donnees PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: discord_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-discord_bot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialisation automatique des tables SQL au premier lancement
      - ./src/database/captcha-tables.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-discord_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
