services:
  # Service du Bot Discord & API Webhook (avec SQLite)
  bot:
    build: .
    container_name: discord_bot
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Persistance de la base de donnees SQLite
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      # Configuration Discord
      DISCORD_TOKEN: ${DISCORD_TOKEN:-${BOT_TOKEN}}
      BOT_TOKEN: ${BOT_TOKEN:-${DISCORD_TOKEN}}
      CLIENT_ID: ${CLIENT_ID}
      GUILD_ID: ${GUILD_ID}

      # Configuration Serveur Express & Base de Donnees SQLite
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      DB_PATH: "/app/data/bot.db"

      # Configuration OpenAI API
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-500}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.7}

      # Configuration OpenRouter
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-20b:free}
