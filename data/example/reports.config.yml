# data/example/reports.config.yml
#
# Template de configuration pour la feature "reports".
# Généré automatiquement depuis src/modules/feature_reports/config/defaults.js.
#
# Ne PAS modifier manuellement ici : c'est un exemple versionné.
# Pour modifier la config par défaut, édite plutôt :
#   data/default/reports.config.yml  (modifiable par l'admin, gitignore)
