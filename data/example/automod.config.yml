# data/example/automod.config.yml
#
# Template de configuration pour la feature "automod".
# Généré automatiquement depuis src/modules/feature_automod/config/defaults.js.
#
# Ne PAS modifier manuellement ici : c'est un exemple versionné.
# Pour modifier la config par défaut, édite plutôt :
#   data/default/automod.config.yml  (modifiable par l'admin, gitignore)
#   data/{guildId}/automod.config.yml  (override par guilde, gitignore).
enabled: false
allowed_roles: []
spam:
  enabled: true
  max_messages: 5
  window_seconds: 5
  max_mentions: 3
  mentions_window_seconds: 10
  action: warn
badwords:
  enabled: true
  list: []
  case_sensitive: false
  whole_word: true
  action: delete_warn
anti_raid:
  enabled: true
  join_threshold: 8
  window_seconds: 30
  action: alert
  lock_duration_seconds: 300
anti_invite:
  enabled: true
  whitelist_guilds: []
  action: delete_warn
anti_link:
  enabled: false
  whitelist_domains:
    - github.com
    - discord.com
    - discord.gg
  action: delete
mass_mention:
  enabled: true
  threshold: 5
  action: delete_warn
anti_caps:
  enabled: false
  min_length: 10
  caps_ratio: 0.7
  action: delete_warn
anti_attachment_spam:
  enabled: false
  max_attachments: 3
  window_seconds: 10
  max_per_message: 5
  action: delete_warn
anti_zalgo:
  enabled: false
  max_zalgo_chars: 3
  action: delete_warn
anti_sticker:
  enabled: false
  action: delete
channel_rules: {}
sanctions:
  warn_expire_days: 30
  progression:
    - warnings: 3
      action: mute
      duration: 1h
    - warnings: 5
      action: mute
      duration: 24h
    - warnings: 7
      action: kick
    - warnings: 10
      action: ban
log_channel_id: null
dm_on_action: true
