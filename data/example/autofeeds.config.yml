# data/example/autofeeds.config.yml
#
# Template de configuration pour la feature "autofeeds".
# Généré automatiquement depuis src/modules/util_autofeeds/config/defaults.js.
#
# Ne PAS modifier manuellement ici : c'est un exemple versionné.
# Pour modifier la config par défaut, édite plutôt :
#   data/default/autofeeds.config.yml  (modifiable par l'admin, gitignore)
#   data/{guildId}/autofeeds.config.yml  (override par guilde, gitignore).
enabled: true
check_interval_minutes: 15
max_feeds_per_guild: 25

# Configuration globale ou par serveur pour les APIs et flux tiers
twitch:
  client_id: ""
  client_secret: ""
  eventsub_secret: ""

youtube:
  api_key: ""

poll_intervals:
  live_minutes: 2
  video_minutes: 15
  rss_minutes: 30

error_handling:
  alert_after_errors: 3
  max_consecutive_errors: 10

log_channel_id: null
